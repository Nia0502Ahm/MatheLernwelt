<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MatheLernwelt</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         STARTSEITE
    ====================================================== -->

    <section id="startseite" class="seite">

        <div class="karte">

            <h1>MatheLernwelt</h1>

            <p>
                Mathe lernen von Klasse 5 bis Abitur
            </p>

            <button onclick="zeigeSprachen()">
                Starten
            </button>

        </div>

    </section>


    <!-- =====================================================
         SPRACHWAHL
    ====================================================== -->

    <section
        id="sprachen"
        class="seite versteckt"
    >

        <div class="karte">

            <h2 id="spracheTitel">
                Sprache auswählen
            </h2>

            <button
                onclick="spracheAuswaehlen('de')"
            >
                🇩🇪 Deutsch
            </button>

            <button
                onclick="spracheAuswaehlen('en')"
            >
                🇬🇧 English
            </button>

            <button
                onclick="spracheAuswaehlen('ps')"
            >
                🇦🇫 پښتو
            </button>

        </div>

    </section>


    <!-- =====================================================
         ANMELDUNG
    ====================================================== -->

    <section
        id="anmeldung"
        class="seite versteckt"
    >

        <div class="karte">

            <h2 id="anmeldeTitel">
                Anmelden
            </h2>

            <input
                id="email"
                type="email"
                placeholder="E-Mail"
                autocomplete="email"
            >

            <input
                id="passwort"
                type="password"
                placeholder="Passwort"
                autocomplete="current-password"
            >

            <button onclick="anmelden()">
                Einloggen
            </button>

            <button onclick="registrieren()">
                Konto erstellen
            </button>

            <button
                class="sekundaer"
                onclick="zeigeSprachen()"
            >
                Zurück
            </button>

        </div>

    </section>


    <!-- =====================================================
         KLASSENAUSWAHL
    ====================================================== -->

    <section
        id="klassen"
        class="seite versteckt"
    >

        <!-- Wird von App.js gefüllt -->

    </section>


    <!-- =====================================================
         THEMEN
    ====================================================== -->

    <section
        id="themen"
        class="seite versteckt"
    >

        <!-- Wird von App.js gefüllt -->

    </section>


    <!-- =====================================================
         AUFGABEN
    ====================================================== -->

    <section
        id="aufgaben"
        class="seite versteckt"
    >

        <!-- Wird von App.js gefüllt -->

    </section>


    <!-- =====================================================
         ERGEBNIS
    ====================================================== -->

    <section
        id="ergebnis"
        class="seite versteckt"
    >

        <!-- Wird von App.js gefüllt -->

    </section>


    <!-- =====================================================
         APP.JS
    ====================================================== -->

    <script src="App.js"></script>

</body>

</html>
