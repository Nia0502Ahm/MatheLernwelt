<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatheLernwelt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Startseite -->
    <div id="startseite" class="container">
        <h1>MatheLernwelt</h1>
        <p>Mathe lernen von Klasse 5 bis Abitur</p>
        <button onclick="zeigeSprachen()">Starten</button>
    </div>

    <!-- Sprachauswahl -->
    <div id="sprachen" class="container versteckt">
        <h1 id="sprachTitel">Sprache auswählen</h1>

        <button onclick="spracheAuswaehlen('de')">🇩🇪 Deutsch</button>
        <button onclick="spracheAuswaehlen('en')">🇬🇧 English</button>
        <button onclick="spracheAuswaehlen('ps')">🇦🇫 پښتو</button>
    </div>

 <!-- Klassenauswahl -->
<div id="klassen" class="container versteckt">
    <h1 id="klassenTitel">Wähle deine Klasse</h1>
    <p id="klassenText">Wähle eine Klasse aus:</p>

    <div class="klassenListe">
        <button onclick="klasseAuswaehlen(5)">Klasse 5</button>
        <button onclick="klasseAuswaehlen(6)">Klasse 6</button>
        <button onclick="klasseAuswaehlen(7)">Klasse 7</button>
        <button onclick="klasseAuswaehlen(8)">Klasse 8</button>
        <button onclick="klasseAuswaehlen(9)">Klasse 9</button>
        <button onclick="klasseAuswaehlen(10)">Klasse 10</button>
        <button onclick="klasseAuswaehlen(11)">Klasse 11</button>
        <button onclick="klasseAuswaehlen(12)">Klasse 12</button>
        <button onclick="klasseAuswaehlen(13)">Klasse 13 / Abitur</button>
    </div>

    <p id="klassenMeldung"></p>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

</body>
</html>
